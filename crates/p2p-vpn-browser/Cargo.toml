[package]
name = "p2p-vpn-browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser WebAssembly host for the p2p-vpn packet and authorization core"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-hooks = []

[dependencies]
p2p-vpn = { path = "../.." }
futures = "0.3.33"
libp2p = { version = "0.56.0", features = ["ed25519", "macros", "request-response", "identify", "ping"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp"] }
web-time = "1.1.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
libp2p = { version = "0.56.0", features = ["wasm-bindgen", "webrtc-websys"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p2p-vpn = { path = "../..", features = ["webrtc"] }
libp2p-webrtc = { version = "=0.9.0-alpha.1", features = ["tokio"] }
rand = "0.8"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
webrtc-dtls = "0.11.0"
