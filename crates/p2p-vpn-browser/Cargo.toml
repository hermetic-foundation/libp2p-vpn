[package]
name = "p2p-vpn-browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser WebAssembly host for the p2p-vpn packet and authorization core"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["relay-client"]
test-hooks = []
relay-client = ["dep:getrandom", "libp2p/relay", "libp2p/noise", "libp2p/yamux", "libp2p/kad"]

[[bin]]
name = "browser-relay-fixture"
required-features = ["relay-client", "test-hooks"]

[dependencies]
p2p-vpn = { path = "../.." }
futures = "0.3.33"
libp2p = { version = "0.56.0", features = ["ed25519", "macros", "request-response", "identify", "ping"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp"] }
web-time = "1.1.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Yamux uses rand 0.9, which needs the getrandom 0.3 browser backend.
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
libp2p = { version = "0.56.0", features = ["wasm-bindgen", "webrtc-websys"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
multistream-select = "0.13.0"
send_wrapper = "0.6.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["BinaryType", "Event", "Headers", "Location", "MessageEvent", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Storage", "WebSocket", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p2p-vpn = { path = "../..", features = ["webrtc"] }
libp2p-webrtc = { version = "=0.9.0-alpha.1", features = ["tokio"] }
rand = "0.8"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
webrtc-dtls = "0.11.0"
