<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>p2p-vpn</title>
  <link rel="icon" href="./pkg/logo.svg">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <div class="bar">
      <img src="./pkg/logo.svg" alt="" width="32" height="32">
      <h1>p2p-vpn</h1>
    </div>
  </header>
  <main>
    <section aria-labelledby="connection">
      <div class="section-title">
        <h2 id="connection">Connection</h2>
        <span id="state" class="state" role="status">Loading</span>
      </div>
      <form id="connect-form">
        <div id="config-fields">
          <div class="choices" role="group" aria-label="Enrollment">
            <button id="use-config" type="button" aria-pressed="true">Config</button>
            <button id="use-credentials" type="button" aria-pressed="false">Credentials</button>
            <button id="use-code" type="button" aria-pressed="false">Pair code</button>
            <button id="use-offer" type="button" aria-pressed="false">Invite file</button>
          </div>
          <div id="config-import">
            <label for="config">Peer config</label>
            <input id="config" type="file" accept=".json,application/json" required>
            <div id="credential-input" hidden>
              <label for="credential-passphrase">Bundle passphrase</label>
              <input id="credential-passphrase" type="password" autocomplete="current-password" maxlength="1024">
            </div>
          </div>
          <div id="pair-inputs" hidden>
            <label for="pair-code">Pairing code</label>
            <input id="pair-code" type="password" autocomplete="off" maxlength="64">
            <label for="pair-hostname">Hostname</label>
            <input id="pair-hostname" type="text" autocomplete="off" spellcheck="false" maxlength="63">
            <details>
              <summary>Pairing protocol</summary>
              <label for="pair-version">Version</label>
              <select id="pair-version">
                <option value="2">v2</option>
                <option value="1">v1 (scoped)</option>
              </select>
              <div id="pair-network-input" hidden>
                <label for="pair-network">Network name</label>
                <input id="pair-network" type="text" autocomplete="off" spellcheck="false" maxlength="255">
              </div>
            </details>
          </div>
          <div id="offline-offer-fields" hidden>
            <label for="offline-offer">Offer file</label>
            <input id="offline-offer" type="file" accept=".json,application/json">
            <label for="offline-uri">Or invitation URI</label>
            <textarea id="offline-uri" rows="2" autocomplete="off" spellcheck="false" maxlength="49152"></textarea>
          </div>
          <div id="offline-response-fields" hidden>
            <label for="offline-response">Signed response</label>
            <input id="offline-response" type="file" accept=".json,application/json">
          </div>
          <label for="address">Native peer address</label>
          <input id="address" type="text" required autocomplete="off" spellcheck="false" maxlength="1024">
        </div>
        <div class="actions">
          <button id="connect" disabled>Connect</button>
          <button id="download-request" type="button" hidden>Download request</button>
          <button id="listen-relay" type="submit" disabled hidden>Listen on relay</button>
          <button id="disconnect" type="button" hidden>Disconnect</button>
          <button id="export-config" type="button" hidden>Download config</button>
        </div>
      </form>
      <dl id="identity" hidden>
        <dt>Remote peer</dt>
        <dd id="peer-id"></dd>
      </dl>
      <dl id="relay-reservation" hidden>
        <dt>Relay address</dt>
        <dd id="relay-address"></dd>
      </dl>
      <button id="publish-relay" type="button" hidden>Publish relay address</button>
      <p id="relay-publication-result" aria-live="polite" hidden></p>
    </section>
    <section aria-labelledby="request">
      <h2 id="request">Overlay HTTP</h2>
      <form id="request-form">
        <div class="endpoint">
          <div>
            <label for="ip">Overlay address</label>
            <input id="ip" type="text" required autocomplete="off" spellcheck="false" placeholder="100.64.0.1">
          </div>
          <div>
            <label for="port">Port</label>
            <input id="port" type="number" required min="1" max="65535" value="80">
          </div>
        </div>
        <label for="path">Path</label>
        <input id="path" type="text" required value="/" spellcheck="false" autocomplete="off" maxlength="4096">
        <div class="actions"><button id="send" disabled>Send request</button></div>
      </form>
      <pre id="response" aria-label="HTTP response" tabindex="0" hidden></pre>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <dialog id="export-dialog" aria-labelledby="export-title">
    <h2 id="export-title">Download credentials</h2>
    <form id="export-form" method="dialog">
      <label for="export-passphrase">New passphrase</label>
      <input id="export-passphrase" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
      <p id="export-error" role="alert" hidden></p>
      <div class="actions">
        <button id="cancel-export" type="button">Cancel</button>
        <button id="save-export">Download</button>
      </div>
    </form>
  </dialog>
</body>
</html>
