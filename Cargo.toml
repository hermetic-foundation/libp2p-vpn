[package]
name = "libp2p-vpn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust foundation for a libp2p-native packet-oriented mesh VPN"
autobins = false

[lib]
name = "p2p_vpn"

[workspace]
members = [
    "crates/p2p-vpn-android",
    "crates/p2p-vpn-android-e2e-fixture",
    "crates/p2p-vpn-browser",
]
default-members = ["."]
resolver = "3"
exclude = [
    "vendor/libp2p-0.56.0",
    "vendor/libp2p-allow-block-list-0.6.0",
    "vendor/libp2p-autonat-0.15.0",
    "vendor/libp2p-connection-limits-0.6.0",
    "vendor/libp2p-core-0.43.2",
    "vendor/libp2p-dcutr-0.14.1",
    "vendor/libp2p-dns-0.44.0",
    "vendor/libp2p-gossipsub-0.49.5",
    "vendor/libp2p-identify-0.47.0",
    "vendor/libp2p-kad-0.48.0",
    "vendor/libp2p-mdns-0.48.0",
    "vendor/libp2p-metrics-0.17.0",
    "vendor/libp2p-noise-0.46.1",
    "vendor/libp2p-ping-0.47.0",
    "vendor/libp2p-quic-0.13.1",
    "vendor/libp2p-relay-0.21.1",
    "vendor/libp2p-request-response-0.29.0",
    "vendor/libp2p-swarm-0.47.1",
    "vendor/libp2p-tcp-0.44.1",
    "vendor/libp2p-tls-0.6.2",
    "vendor/libp2p-upnp-0.5.0",
    "vendor/stats_alloc-0.1.10",
    "vendor/quinn-0.11.11",
    "vendor/quinn-udp-0.5.15",
    "vendor/libp2p-webrtc-0.9.0-alpha.1",
    "vendor/libp2p-webrtc-utils-0.4.0",
    "vendor/libp2p-webrtc-websys-0.4.0",
    "vendor/libp2p-yamux-0.47.0",
    "vendor/webrtc-0.12.0",
    "vendor/webrtc-dtls-0.11.0",
]

[features]
webrtc = ["dep:libp2p-webrtc"]
allocation-review = []
allocation-sizes = ["allocation-review", "stats_alloc/size-inventory"]
battery-diagnostics = []
demand-lifecycle-trial = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
base32 = "0.5.1"
chacha20poly1305 = "0.10.1"
futures = "0.3.33"
hkdf = "0.12.4"
hmac = "0.12.1"
libp2p = { version = "0.56.0", path = "vendor/libp2p-0.56.0", features = ["ed25519", "macros", "request-response", "relay"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha2_010 = { package = "sha2", version = "0.10.9" }
spake2 = "0.4.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hickory-proto = "0.25.2"
hickory-resolver = "0.25.2"
libp2p = { version = "0.56.0", path = "vendor/libp2p-0.56.0", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "identify", "ping", "kad", "mdns", "relay", "dcutr", "autonat", "rsa"] }
quinn = { version = "0.11.11", path = "vendor/quinn-0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13.2", features = ["pem", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["full"] }
if-addrs = "0.15.0"
libp2p-webrtc = { version = "=0.9.0-alpha.1", path = "vendor/libp2p-webrtc-0.9.0-alpha.1", features = ["tokio"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
libp2p = { version = "0.56.0", path = "vendor/libp2p-0.56.0", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }
rustls-pki-types = { version = "1", features = ["web"] }

[target.'cfg(target_os = "linux")'.dependencies]
httparse = "1.10.1"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["compat"] }
multistream-select = "0.13.0"
socket2 = { version = "0.6.5", features = ["all"] }
mio = { version = "1.2.2", default-features = false, features = ["os-poll", "os-ext"] }
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.28.0"
rtnetlink = "0.20.0"
rustix = { version = "1.1.4", features = ["process"] }
tun = "0.8.14"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.8", features = ["tokio"] }
widestring = "1.2.1"
same-file = "1.0.6"
windows-permissions = "0.2.4"
tun-rs = "=2.8.15"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4.29"
multistream-select = "0.13.0"
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
stats_alloc = { version = "=0.1.10", path = "vendor/stats_alloc-0.1.10" }
socket2 = { version = "0.6.5", features = ["all"] }
futures-timer = "3.0.3"
web-time = "1.1.0"
